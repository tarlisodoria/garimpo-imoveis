name: CI

# Testes, lint, formatação e build em todo push e pull request, mais um teste
# de integração com Postgres descartável. Sem secrets: o build lê só o
# snapshot versionado e o banco do teste existe só durante o job.

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build

  integracao:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # postgres:16-alpine fixado por digest.
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: garimpo_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teste -d garimpo_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciais do container descartável acima; não são secrets.
      TEST_DATABASE_URL: postgres://teste:teste@localhost:5432/garimpo_teste
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrations, diff e persistência num Postgres real
        run: npm run test:integracao
