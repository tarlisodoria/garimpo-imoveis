name: Aplicar migrations do banco

on:
  # Manual: aplicar uma migration sem esperar a coleta diária.
  workflow_dispatch:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: migrate-neon-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Logs públicos: esconde host, endpoint e usuário do banco em qualquer
      # saída posterior (o GitHub já mascara a URL completa do secret).
      - name: Mask database connection details
        shell: bash
        run: |
          node -e 'const u = new URL(process.env.DATABASE_URL); for (const v of [u.hostname, u.hostname.split(".")[0], u.username]) if (v) console.log("::add-mask::" + v);'

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate
