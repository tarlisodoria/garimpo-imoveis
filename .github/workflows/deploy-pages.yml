name: Deploy Cloudflare Pages

# Site 100% estático: o build lê só o snapshot versionado (data/) e não acessa
# o banco. Por isso este workflow precisa apenas das credenciais da Cloudflare.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Em push usa o commit exato; via coleta diaria pega a ponta da main,
          # que ja inclui o commit do snapshot feito pelo job anterior.
          ref: ${{ github.event_name == 'push' && github.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Falha cedo, antes do build e da publicação. Arquivos gerados
      # (data/, db/migrations/meta/) ficam no .prettierignore.
      - name: Check formatting
        run: npm run format:check

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy out \
            --project-name=garimpo-imoveis \
            --branch=main \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="$(git log -1 --pretty=%s)"

      - name: Summarize deploy
        shell: bash
        run: |
          echo "## Deploy Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://garimpo-imoveis.pages.dev" >> "$GITHUB_STEP_SUMMARY"
