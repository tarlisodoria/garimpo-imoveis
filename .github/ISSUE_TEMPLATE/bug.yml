name: Problema no site ou no pipeline
description: Erro de página, build, coleta ou documentação.
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abrir ...
        2. Rodar ...
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: "navegador, sistema operacional ou versão do Node"
